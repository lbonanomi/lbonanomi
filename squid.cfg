# ==============================================================================
# SQUID PROXY CONFIGURATION WITH SSL-BUMP & METHOD-BASED DESTINATION RESTRICTIONS
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network & Port Configurations
# ------------------------------------------------------------------------------
# Explicit forward proxy port with SSL-Bump enabled
http_port 3128 ssl-bump \
    cert=/etc/squid/ssl/squidCA.pem \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB

# Helper process for dynamic certificate generation
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 8 startup=2 idle=1

# ------------------------------------------------------------------------------
# 2. Client ACLs & Standard Ports
# ------------------------------------------------------------------------------
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localhost src 127.0.0.1/32 ::1

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 1025-65535  # unregistered ports

acl CONNECT method CONNECT

# Standard baseline security checks
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# ------------------------------------------------------------------------------
# 3. SSL-Bump (TLS Interception & Inspection)
# ------------------------------------------------------------------------------
# ACL for domains that break under TLS interception (e.g., certificate pinned apps, banking)
acl bypass_ssl_domains ssl::server_name .bank.com .apple.com

# SSL-Bump step detection
acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3

# Step 1: Peek at client TLS Hello to extract SNI (destination hostname)
ssl_bump peek step1

# Step 2: Pass through pinned/banking domains without decrypting
ssl_bump splice bypass_ssl_domains

# Step 3: Bump (decrypt) everything else to inspect headers & methods
ssl_bump bump step2
ssl_bump bump step3

# ------------------------------------------------------------------------------
# 4. Method & Target Destination Definitions
# ------------------------------------------------------------------------------
# Define HTTP Methods
acl method_get     method GET HEAD
acl method_post    method POST
acl method_modify  method PUT DELETE PATCH

# Define Target Domains (leading dot matches subdomains)
# ssl::server_name matches during TLS handshake; dstdomain matches post-decryption
acl readonly_sites dstdomain .read-only-partner.com docs.example.com
acl internal_apis  dstdomain api.corp.internal

# ------------------------------------------------------------------------------
# 5. Method-Level Access Rules (Top-Down Evaluation)
# ------------------------------------------------------------------------------

# 1. Allow CONNECT so clients can initiate the TLS tunnel for SSL-Bump evaluation
http_access allow localnet CONNECT

# 2. Enforce GET/HEAD only on read-only destinations
http_access allow localnet readonly_sites method_get
http_access deny  readonly_sites

# 3. Allow GET, POST, and modification methods on internal APIs
http_access allow localnet internal_apis method_get
http_access allow localnet internal_apis method_post
http_access allow localnet internal_apis method_modify
http_access deny  internal_apis

# 4. Default policy for other general sites (e.g., standard browsing)
http_access allow localnet method_get
http_access allow localnet method_post

# Fallback: Deny all unauthenticated or unpermitted traffic
http_access deny all

# ------------------------------------------------------------------------------
# 6. Operational & Cache Settings
# ------------------------------------------------------------------------------
coredump_dir /var/spool/squid
shutdown_lifetime 3 seconds
logfile_rotate 7
